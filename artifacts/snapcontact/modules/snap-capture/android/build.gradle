plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.snapcontact.capture'
version = '1.0.0'

android {
  namespace "com.snapcontact.capture"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
    // Applied to the app's release build so R8 doesn't break ML Kit (see the file).
    consumerProguardFiles 'proguard-rules.pro'
  }
}

dependencies {
  implementation 'com.google.mlkit:text-recognition:16.0.1'
  // Versions match what the app's release build already resolves (see `:app:dependencies`).
  implementation 'androidx.core:core-ktx:1.18.0'
  implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.10.2'
  implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
}
