plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.snapcontact.capture'
version = '1.0.0'

android {
  namespace "com.snapcontact.capture"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  // Play Services text recognition: kept up to date by Google (the bundled 16.0.1 is from 2024
  // and failed inside recognize on current Android). The model is fetched by Play Services.
  implementation 'com.google.android.gms:play-services-mlkit-text-recognition:19.0.2'
  implementation 'androidx.core:core-ktx:1.13.1'
  implementation 'androidx.appcompat:appcompat:1.7.0'
  implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.8.0'
  implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.0'
}
